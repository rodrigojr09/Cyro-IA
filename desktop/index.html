<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JARVIS 0.3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#e8f5ff;font:14px Segoe UI,Arial,sans-serif}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#101c31;-webkit-app-region:drag}header button{-webkit-app-region:no-drag}h1{font-size:15px;letter-spacing:4px;color:#60dfff;margin:0}button{cursor:pointer;border:0;background:#17314c;color:#c6f5ff;border-radius:8px;padding:8px 12px}button:hover{background:#215376}main{height:calc(100vh - 124px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.message{padding:12px;border-radius:12px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.user{background:#193a55;align-self:flex-end;max-width:90%}.assistant{background:#152237;align-self:flex-start;max-width:95%}footer{height:70px;display:flex;gap:8px;align-items:center;padding:10px;background:#101c31}input{flex:1;min-width:0;background:#0a1628;color:white;border:1px solid #264a64;border-radius:8px;padding:12px;outline:none}#status{font-size:11px;color:#71bdd5;padding:0 16px 8px;background:#101c31}
</style></head><body>
<style>
body{height:100vh;display:flex;flex-direction:column}header,footer,#status,#programming-controls,#computer-controls{flex-shrink:0}main#messages{flex:1;height:auto!important;min-height:0}.code-block{margin:8px 0;max-width:100%;background:#091526;padding:8px;border-radius:8px}.code-block pre{overflow-x:auto;white-space:pre;font:12px Consolas,monospace;user-select:text}.code-block button{font-size:11px}#programming-controls{padding:8px 12px;background:#101c31;font-size:12px}#programming-controls .row{display:flex;gap:6px;align-items:center;margin-top:5px}#project-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#71bdd5}#authorized-roots{min-width:0;flex:1;background:#17314c;color:white}[hidden]{display:none!important}button:disabled{opacity:.5;cursor:default}#status{min-height:22px}
</style>
<header><h1>◉ JARVIS</h1><div><button id="minimize" aria-label="Minimizar">−</button> <button id="close" aria-label="Fechar">×</button></div></header>
<div id="programming-controls"><label><input type="checkbox" id="programming-mode" checked> Análise de projetos · somente leitura</label><div id="project-name">Nenhum projeto selecionado</div><div class="row"><button id="authorize-project">Autorizar pasta</button><select id="authorized-roots" aria-label="Pastas autorizadas"></select><button id="revoke-root">Revogar</button></div></div>
<div id="computer-controls" style="display:flex;gap:8px;padding:8px 16px;height:48px"><select id="computer-action" aria-label="Controle do computador" style="min-width:0;flex:1;background:#17314c;color:#e8f5ff;border-radius:8px"><option value="system">Informações do sistema</option><option value="processes">Listar processos</option><option value="app:notepad">Abrir Bloco de Notas</option><option value="app:calculator">Abrir Calculadora</option><option value="app:vscode">Abrir VS Code</option><option value="folder:desktop">Abrir Área de Trabalho</option><option value="folder:documents">Abrir Documentos</option><option value="folder:downloads">Abrir Downloads</option></select><button id="computer-run">Consultar / abrir</button></div>
<main id="messages" style="height:calc(100vh - 194px)"><div class="message assistant">Sistema inicializado. Como posso ajudar?</div></main>
<footer><input id="input" placeholder="Digite sua mensagem..." maxlength="6000"/><button id="send">Enviar</button></footer>
<div id="status">Conectando ao núcleo...</div>
<script src="renderer.js"></script></body></html>
